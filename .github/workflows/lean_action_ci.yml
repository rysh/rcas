name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      # `lake build` includes RCAS/Audit.lean, which fails the build if any declaration in the
      # namespace `RCAS` depends on an axiom other than propext / Classical.choice / Quot.sound.
      - uses: leanprover/lean-action@v1
