name = "rcas"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["RCAS"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no per-file copyright headers; licence: Apache-2.0 (see LICENSE)
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "RCAS"
